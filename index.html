<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WRSTL Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Nunito:wght@400;700;800;900&display=swap">
<style>
:root{
  --bg:#0e0c11; --panel:#1a161f; --panel2:#241e2b; --line:#3a3143; --ink:#f7f0e9; --muted:#b3a8b8;
  --orange:#F27121; --orange2:#ff9a4d; --gold:#f5c542; --red:#e5483f; --blue:#3a86ff; --green:#39d17a;
  --common:#a3acb6; --rare:#4b95ff; --epic:#b866ff; --legendary:#ffb020;
  --display:"Oswald",Impact,"Arial Narrow",sans-serif; --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  background-image:repeating-linear-gradient(90deg,rgba(242,113,33,.05) 0 2px,transparent 2px 60px),repeating-linear-gradient(0deg,rgba(242,113,33,.04) 0 2px,transparent 2px 60px);}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative;background:linear-gradient(180deg,#15111a,#0e0c11 40%);box-shadow:0 0 60px rgba(0,0,0,.6);display:flex;flex-direction:column}
.screen{flex:1;padding:14px 16px 96px;position:relative}
h1,h2,h3,.disp{font-family:var(--display);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-size:24px}h3{font-size:17px;letter-spacing:1px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--orange);color:#1b0d03;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:17px;padding:12px 18px;border-radius:12px;box-shadow:0 4px 0 #9c4410;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9c4410}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #0b090d}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 #8f6d12}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;background:var(--panel2);font-size:12px;font-weight:800}
.tartan{height:6px;background:repeating-linear-gradient(90deg,var(--orange) 0 16px,#222 16px 21px,#7a3310 21px 31px,#222 31px 35px)}

/* HUD */
.hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(14,12,17,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hud .av{width:42px;height:42px;border-radius:50%;background:#2a2230;border:3px solid var(--orange);flex:none;object-fit:cover;object-position:center 30%}
.xpbar{height:8px;background:#2c2433;border-radius:9px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:9px;transition:width .6s}
.hudstat{font-weight:900;font-size:14px;white-space:nowrap}
.hudstat small{display:block;font-size:10px;color:var(--muted);font-weight:700;text-align:center}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(20,16,24,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{padding:8px 0 10px;font-size:11px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button b{font-size:21px;line-height:1}
.nav button.on{color:var(--orange)}
.nav .dot{position:absolute;top:5px;right:calc(50% - 20px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}

/* title */
.title{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px 40px;gap:14px;background:radial-gradient(circle at 50% 30%,rgba(242,113,33,.25),transparent 60%)}
.title img.logo{width:min(320px,80%);filter:drop-shadow(0 6px 20px rgba(242,113,33,.35))}
.title h1{font-size:clamp(44px,12vw,64px);line-height:.95}
.title h1 span{color:var(--orange)}
.squad{display:flex;justify-content:center;margin:6px 0 4px}
.squad img{width:64px;height:64px;object-fit:contain;margin:0 -8px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}

/* select */
.chargrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.charcard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:left;position:relative;overflow:hidden}
.charcard.sel{border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,113,33,.25)}
.charcard img{width:100%;height:120px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.charcard .lv{position:absolute;top:8px;left:8px;font-size:10px}
.charcard.locked img{filter:brightness(0) opacity(.5)}
.detail{margin-top:12px}
.statbars{display:grid;gap:6px;margin:10px 0}
.sb{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.sb .bar{height:10px;background:#2c2433;border-radius:9px;overflow:hidden}
.sb .bar i{display:block;height:100%;border-radius:9px;background:var(--orange)}
.motto{font-style:italic;color:var(--orange2);margin:6px 0}

/* map */
.mapwrap{margin:0 -16px -40px;position:relative}
.mapwrap svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node .ring{transition:r .2s}
.node.open .pulse{animation:pulse 1.6s infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.maplabel{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.5px;paint-order:stroke;stroke:#0b0a0d;stroke-width:4px;fill:#fff}
.zonelabel{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:3px;fill:rgba(255,255,255,.14)}
.token{pointer-events:none}
.mapbar{position:sticky;top:59px;z-index:20;margin:-14px -16px 0;padding:8px 16px;background:linear-gradient(180deg,rgba(14,12,17,.95),rgba(14,12,17,0));display:flex;gap:8px;align-items:center}

/* gym */
.gymhead{border-radius:18px;padding:16px;background:linear-gradient(135deg,#3a1d0b,#1a161f 70%);border:1px solid #5a3317;position:relative;overflow:hidden}
.gymhead .big{font-size:52px;position:absolute;right:12px;top:6px;opacity:.9}
.opp{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-top:8px}
.oav{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:none;border:3px solid var(--blue);background:#1f2940 center/contain no-repeat;overflow:hidden}
.oav img{width:100%;height:100%;object-fit:contain}
.pips{display:flex;gap:5px}
.pips i{width:14px;height:14px;border-radius:50%;background:#2c2433;border:2px solid var(--line)}
.pips i.on{background:var(--green);border-color:var(--green)}
.champ{margin-top:14px;padding:14px;border-radius:18px;border:2px solid var(--gold);background:linear-gradient(135deg,rgba(245,197,66,.18),rgba(26,22,31,1) 60%)}
.champ.locked{border-color:var(--line);background:var(--panel);opacity:.9}
.champ .oav{width:84px;height:84px;font-size:48px;border-color:var(--gold)}
.stampmark{display:inline-block;transform:rotate(-8deg);border:3px solid var(--red);color:var(--red);font-family:var(--display);padding:2px 10px;border-radius:8px;font-size:15px;letter-spacing:1px}

/* bout */
.bout{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 55%,#3b1d0e 0%,#150f13 55%,#0b090c 100%);padding:10px 12px 18px;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.sc{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px}
.sc.me{background:linear-gradient(90deg,rgba(229,72,63,.35),transparent)}
.sc.op{background:linear-gradient(270deg,rgba(58,134,255,.35),transparent);flex-direction:row-reverse;text-align:right}
.sc .pts{font-family:var(--display);font-size:40px;line-height:1;min-width:38px;text-align:center}
.sc .nm{font-weight:900;font-size:13px;line-height:1.15}
.clock{text-align:center;font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:1px}
.expips{display:flex;gap:4px;justify-content:center;margin-top:3px}
.expips i{width:9px;height:9px;border-radius:50%;background:#3a3143}
.expips i.done{background:var(--orange)}
.expips i.now{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.mat{position:relative;height:210px;margin:6px 0 4px}
.mat .circle{position:absolute;left:50%;top:58%;width:330px;height:130px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#f0c27a 0 34%,#c9383a 35% 43%,#1f4fa3 44% 100%);box-shadow:0 14px 30px rgba(0,0,0,.6) inset,0 0 0 4px #0b0a0d}
.fighter{position:absolute;bottom:20px;width:130px;height:150px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.fighter img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 6px rgba(0,0,0,.6))}
.fighter.me{left:calc(50% - 150px)}
.fighter.op{right:calc(50% - 150px)}
.fighter .emo{width:122px;height:134px;margin:14px auto 0;border-radius:40px 40px 18px 18px;overflow:hidden;background:radial-gradient(circle at 40% 35%,#4a6fb5,#1b2d57);border:5px solid var(--blue);box-shadow:0 8px 10px rgba(0,0,0,.5)}
.fighter .emo img{width:100%;height:100%;object-fit:cover}
.fighter .emo.mine{border-color:var(--red);background:radial-gradient(circle at 40% 35%,#b5533a,#4a1a12)}
.fighter.lunge.me{transform:translateX(50px)}
.fighter.lunge.op{transform:translateX(-50px)}
.fighter.hit{animation:hit .45s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-10px) rotate(-6deg)}60%{transform:translateX(8px) rotate(4deg)}}
.tusk{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:66px;text-align:center}
.tusk img{width:66px;height:80px;object-fit:contain}
.bubble{position:absolute;left:50%;top:-4px;transform:translateX(34px);background:#fff;color:#111;font-weight:900;font-size:13px;padding:5px 9px;border-radius:12px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
.bubble.show{opacity:1}
.float{position:absolute;font-family:var(--display);font-size:46px;font-weight:700;pointer-events:none;animation:float 1.2s forwards;text-shadow:0 3px 0 #000}
@keyframes float{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-60px) scale(1)}}
.stage{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:flex-start}
.panel{background:rgba(20,16,24,.92);border:1px solid var(--line);border-radius:16px;padding:12px}
.tell{font-size:16px;font-weight:800}
.tell b{color:var(--gold)}
.readbar{height:8px;background:#2c2433;border-radius:9px;overflow:hidden;margin-top:6px}
.readbar i{display:block;height:100%;background:var(--green)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.choice b{font-size:30px;line-height:1.1}
.choice span{font-family:var(--display);font-size:16px;letter-spacing:1px;text-transform:uppercase}
.choice small{font-size:10.5px;color:var(--muted);line-height:1.2;text-align:center}
.choice:active{transform:scale(.97)}
.choice.pick{border-color:var(--orange);background:#3a2213}
.reveal{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.rv{padding:10px;border-radius:14px;background:var(--panel2);animation:flip .5s both}
.rv b{font-size:30px;display:block}
.rv.me{border:2px solid var(--red)}.rv.op{border:2px solid var(--blue);animation-delay:.25s}
@keyframes flip{0%{transform:rotateY(90deg);opacity:0}100%{transform:none;opacity:1}}
.verdict{font-family:var(--display);font-size:22px;text-align:center;margin-top:6px}
.verdict.good{color:var(--green)}.verdict.bad{color:#ff8a7a}.verdict.mid{color:var(--gold)}
.meter{position:relative;height:58px;border-radius:14px;background:#221c28;border:2px solid var(--line);overflow:hidden;margin-top:8px;touch-action:manipulation}
.meter .zone{position:absolute;top:0;bottom:0;background:rgba(57,209,122,.35);border-left:2px solid var(--green);border-right:2px solid var(--green)}
.meter .perf{position:absolute;top:0;bottom:0;background:rgba(245,197,66,.75)}
.meter .mk{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:#fff;border-radius:4px;box-shadow:0 0 10px #fff}
.meter .tm{position:absolute;left:0;bottom:0;height:4px;background:var(--orange)}
.tapbtn{height:84px;font-size:26px;margin-top:10px}
.hint{text-align:center;font-weight:800;color:var(--muted);font-size:13px}
.shout{position:absolute;left:10px;bottom:24px;background:var(--orange);color:#1b0d03;font-family:var(--display);padding:4px 10px;border-radius:8px;transform:rotate(-4deg);font-size:15px;opacity:0;transition:opacity .3s}
.shout.show{opacity:1}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,4,7,.78);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .box{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#fff;color:#111;font-weight:800;padding:10px 16px;border-radius:12px;z-index:120;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:pop .3s}

/* bags */
.bags{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.bag{position:relative;height:130px;display:flex;align-items:flex-end;justify-content:center}
.bag .sack{width:92px;height:104px;border-radius:30px 30px 40px 40px;background:linear-gradient(160deg,#ff9a4d,#b94d11);position:relative;box-shadow:0 8px 0 #6d2d09,inset 0 -10px 20px rgba(0,0,0,.25)}
.bag .sack:before{content:"";position:absolute;left:30px;top:-14px;width:32px;height:22px;border-radius:10px 10px 4px 4px;background:#7a3310}
.bag .sack:after{content:"W";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:38px;color:rgba(0,0,0,.35)}
.bag.idle .sack{animation:wob 2.2s infinite}
.bag:nth-child(2).idle .sack{animation-delay:.4s}.bag:nth-child(3).idle .sack{animation-delay:.8s}
@keyframes wob{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-7deg)}90%{transform:rotate(7deg)}95%{transform:rotate(-4deg)}}
.bag.shake .sack{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-5deg)}75%{transform:translate(3px,-1px) rotate(5deg)}}
.bag.dim{opacity:.35}
.loot{border-radius:16px;padding:14px;text-align:center;border:3px solid var(--common);background:var(--panel2);animation:burst .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes burst{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.loot .ic{font-size:54px;line-height:1.1}
.r-common{--rc:var(--common)}.r-rare{--rc:var(--rare)}.r-epic{--rc:var(--epic)}.r-legendary{--rc:var(--legendary)}
.loot[class*="r-"]{border-color:var(--rc);box-shadow:0 0 30px var(--rc)}
.rar{font-family:var(--display);letter-spacing:2px;color:var(--rc);font-size:14px}
.glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,var(--rc),transparent 65%);opacity:.8;animation:pulse 1s infinite}

/* collection */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mcard{border-radius:12px;padding:8px 6px;background:var(--panel2);border:2px solid var(--rc,var(--line));text-align:center;position:relative;min-height:112px}
.mcard .ic{font-size:26px}
.mcard .nm{font-family:var(--display);font-size:13px;letter-spacing:.5px;line-height:1.1;margin:3px 0}
.mcard .ef{font-size:10.5px;color:var(--muted);line-height:1.2}
.mcard .lvl{position:absolute;top:4px;right:6px;font-size:10px;font-weight:900;color:var(--rc)}
.mcard.eq{box-shadow:0 0 0 3px var(--orange)}
.mcard.eq:after{content:"EQUIPPED";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:var(--orange);color:#111;font-size:9px;font-weight:900;padding:1px 6px;border-radius:6px}
.mcard.none{opacity:.3;filter:grayscale(1)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statrow{display:grid;grid-template-columns:26px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.plus{width:34px;height:34px;border-radius:10px;background:var(--orange);color:#111;font-weight:900;font-size:20px}

/* passport */
.passport{background:#f3e7cf;color:#2a1c10;border-radius:16px;padding:16px;box-shadow:inset 0 0 40px rgba(120,80,30,.35)}
.passport h3{color:#7a3310}
.stamps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:3px dashed #b89a6e;display:grid;place-items:center;text-align:center;padding:10px;font-size:11px;font-weight:800;color:#8a7152;position:relative}
.stamp.got{border:4px double #c0392b;color:#c0392b;transform:rotate(-6deg);background:rgba(192,57,43,.06)}
.stamp.got .e{font-size:34px}
.stamp .e{font-size:26px;line-height:1}

@media (max-width:380px){.fighter{width:110px;height:130px}.fighter.me{left:calc(50% - 125px)}.fighter.op{right:calc(50% - 125px)}.choice span{font-size:14px}}
@media (prefers-reduced-motion:reduce){.bag.idle .sack,.node.open .pulse,.glow{animation:none}.fighter{transition:none}}

/* avatar creator */
.avprev{width:170px;height:187px;margin:0 auto;border-radius:24px;background:radial-gradient(circle at 50% 40%,#3a2213,#150f13);border:3px solid var(--orange);overflow:hidden}
.avprev svg,.avprev img{width:100%;height:100%;display:block}
.opt{margin-top:14px}
.opt h3{font-size:14px;margin-bottom:6px;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.sw button.on{border-color:#fff;box-shadow:0 0 0 3px var(--orange)}
.hairs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hairs button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:4px 2px 2px;font-size:11px;font-weight:800;color:var(--muted)}
.hairs button img{width:100%;height:58px;object-fit:cover;object-position:center 15%;display:block}
.hairs button.on{border-color:var(--orange);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:10px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-weight:900}
.seg button.on{border-color:var(--orange);background:#3a2213}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.styles button{text-align:left;padding:10px;border-radius:14px;background:var(--panel2);border:2px solid var(--line)}
.styles button.on{border-color:var(--orange);background:#3a2213}
.namein{width:100%;font:800 18px var(--body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--ink)}
.namein:focus{outline:none;border-color:var(--orange)}
.oav.boss{border-color:var(--gold)}
.oav img{object-fit:cover;object-position:center 20%}
.oav.boss img{object-fit:contain}
.nick{color:var(--gold);font-weight:900;font-size:12.5px}
.fighter.op img.av{border-radius:50% 50% 16px 16px}

</style>

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=clamp(Math.round(r*(1+amt)),0,255); g=clamp(Math.round(g*(1+amt)),0,255); b=clamp(Math.round(b*(1+amt)),0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

    case 'buzz': front = `<path d="M25 38 Q24 12 50 12 Q76 12 75 38 Q68 25 50 25 Q32 25 25 38Z" fill="${hc}" opacity=".7"/>`; break;
    case 'bald': front = `<path d="M34 18 Q42 14 50 14" stroke="#fff" stroke-width="3" opacity=".25" fill="none" stroke-linecap="round"/>`; break;
    default: front = `<path d="M25 38 Q23 11 50 10 Q77 11 75 38 Q72 26 62 22 Q54 28 40 24 Q30 26 25 38Z" fill="${hc}"/>`;
  }
  const head = f ? `M27 40 Q27 14 50 14 Q73 14 73 40 Q72 60 50 69 Q28 60 27 40Z` : `M26 40 Q26 14 50 14 Q74 14 74 40 Q74 63 50 70 Q26 63 26 40Z`;
  const brow = a.brow==='fierce'

    : `<path d="M34 34 Q39 31 45 34 M55 34 Q61 31 66 34" stroke="${shade(hc,-.1)}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const lashes = f ? `<path d="M35 39 l-3 -2 M65 39 l3 -2" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>` : '';
  const mouth = a.brow==='fierce' ? `<path d="M43 57 Q50 55 57 57" stroke="#6b3a2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>`

const _avCache = new Map();
function avatarURI(a){
  const k = JSON.stringify(a);
  if(!_avCache.has(k)) _avCache.set(k, 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(avatarSVG(a)));

}

// ---------- save ----------
function freshSave(){
  return {v:2, char:null, name:'', av:null, style:'speed', lvl:1, xp:0, pts:0, stats:null, trained:{}, coins:0, energy:20, energyAt:Date.now(),
    gymWins:{}, stamps:{}, cards:{}, equip:[], kit:{owned:{clubSinglet:1}, eq:{singlet:'clubSinglet'}},
    loc:'hq', phoenix:false, rises:0, sound:true, bouts:0, wins:0, tut:false, seenMapTip:false};
}
function loadSave(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.v===2) return Object.assign(freshSave(), s); }catch(e){}
  return freshSave();
}
let S = loadSave();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function startCareer(styleId){
  const c = styleById(styleId);
  if(S.char) S.rises = (S.rises||0) + (S.phoenix?1:0);
  S.char = 'player'; S.style = styleId; S.lvl = 1; S.xp = 0; S.pts = 0; S.stats = {...c.stats}; S.trained = {};
  S.gymWins = {}; S.stamps = {}; S.loc = 'hq'; S.coins = Math.max(S.coins||0, 0);
  if(!S.cards[c.move]) S.cards[c.move] = 1;
  S.equip = [c.move];
  S.energy = maxEnergy(); S.energyAt = Date.now();
  save();
}

// ---------- derived ----------
const me = ()=>{ const st = styleById(S.style); return {name:S.name||'Wrestler', perks:st.perks, sig:st.sig, motto:st.motto, move:st.move, style:st}; };
function playerAv(){ const eq = KIT[S.kit.eq.singlet]; const col = eq && S.kit.eq.singlet!=='clubSinglet' ? eq.col : (S.av&&S.av.singlet)||'#F27121'; return Object.assign({}, S.av||{g:'m',skin:'#ecc3a0',hair:'short',hairCol:'#46301f'}, {singlet:col, logo:'WRSTL'}); }
function kitItems(){ return Object.values(S.kit.eq).filter(Boolean).map(id=>KIT[id]).filter(Boolean); }
function statOf(k){ let v = S.stats[k]; for(const it of kitItems()) v += (it.b[k]||0); return v; }
function readBonus(){ let r = me().perks.read||0; for(const it of kitItems()) r += (it.read||0); return r; }
function maxEnergy(){ return 20 + ((S.char && me().perks.energy)||0); }
function slotsFor(lvl){ return lvl>=20 ? 4 : lvl>=10 ? 3 : 2; }
function xpNeed(L){ return Math.round(30*Math.pow(L,1.35))+20; }
function gymUnlocked(i){ const g=GYMS[i]; return S.lvl>=g.lvl && (i===0 || !!S.stamps[GYMS[i-1].id]); }
function trainCap(){ return 2 + S.lvl; }

function syncEnergy(){
  const max = maxEnergy();
  if(S.energy >= max){ S.energyAt = Date.now(); return; }
  const n = Math.floor((Date.now()-S.energyAt)/60000);
  if(n>0){ S.energy = Math.min(max, S.energy+n); S.energyAt += n*60000; if(S.energy>=max) S.energyAt = Date.now(); save(); }
}
function spendEnergy(n){ syncEnergy(); if(S.energy<n) return false; if(S.energy>=maxEnergy()) S.energyAt = Date.now(); S.energy -= n; save(); return true; }

// ---------- sound ----------
let AC = null;
function ac(){ if(!S.sound) return null; try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){ AC=null; } return AC; }
function tone(f=440, d=.12, type='sine', vol=.12, when=0, slide=0){
  const a = ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+when;
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide), t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.02);
}
function noise(d=.6, vol=.08, when=0){
  const a = ac(); if(!a) return;
  const len = a.sampleRate*d, buf=a.createBuffer(1,len,a.sampleRate), dt=buf.getChannelData(0);
  for(let i=0;i<len;i++) dt[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); f.type='bandpass'; f.frequency.value=1200; f.Q.value=.6;
  g.gain.value=vol; s.buffer=buf; s.connect(f); f.connect(g); g.connect(a.destination); s.start(a.currentTime+when);
}

  perfect:()=>{ [523,659,784,1046].forEach((f,i)=>tone(f,.16,'triangle',.12,i*.07)); noise(.9,.06,.1); },
  bad:()=>tone(220,.25,'sawtooth',.07,0,-90),
  thud:()=>tone(90,.2,'sine',.25,0,-40),

  SFX.rattle();

    function step(t){ const k = clamp((t-t0)/dur,0,1), e = k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const p = path.getPointAtLength(a+(b-a)*e); tok.setAttribute('transform', `translate(${p.x},${p.y-52-Math.abs(Math.sin(k*Math.PI*6))*6})`);
      if(k<1) requestAnimationFrame(step); else res(); }
    requestAnimationFrame(step);
  });
  S.loc = g.id; save(); travelling = false; SFX.whistle();
  go('gym', {gym:g.id});
};

function makeOpp(g, idx){
  const boss = idx==='champ';
  const L = boss ? g.lvl+(g.z===0?2:3) : (g.id==='hq' ? [1,1,2][idx] : g.lvl+idx);
  const bd = boss ? BOSSES[g.boss] : null;
  const style = boss ? bd.style : g.style;
  const st = STYLE_INFO[style];
  const base = 4 + 2.2*(L-1);
  const stats = {};
  STATS.forEach(s=>{ let m = st.stat ? (s.k===st.stat?1.3:0.95) : 1.05; if(boss) m*=1.06; stats[s.k] = Math.round(base*m); });
  if(boss) return {name:bd.name, img:bd.img, L, stats, style, champ:true, gym:g.id, idx, motto:bd.motto, role:bd.role, card:bd.card};
  const m = g.members[idx];
  return {name:m.name, nick:m.nick, from:m.from, av:m.av, blurb:m.blurb, L, stats, style, champ:false, gym:g.id, idx};
}

function oppPlan(){
  const w = {...STYLE_INFO[B.opp.style].w};
  const h = B.hist;
  if(h.length>=2 && h[h.length-1]===h[h.length-2] && Math.random()<.5){
    const counter = Object.keys(MOVES).find(k=>MOVES[k].beats===h[h.length-1]);
    return counter;
  }
  if(h.length>=3 && Math.random()<.25){ // punish favourite move
    const cnt = {}; h.forEach(x=>cnt[x]=(cnt[x]||0)+1); const fav = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
    return Object.keys(MOVES).find(k=>MOVES[k].beats===fav);
  }
  let r = Math.random(), acc=0; for(const k of Object.keys(w)){ acc+=w[k]; if(r<=acc) return k; } return 'SHOOT';
}

async function runBout(){
  const o = B.opp;
  pips();
  stage(`<div class="panel" style="text-align:center">
    <div class="small muted">${o.champ?'BOSS BOUT':'BOUT'} · ${esc(GYMS[gymIdx(o.gym)].name)}</div>

    <p class="small muted" style="margin:0 0 10px">${STYLE_INFO[o.style].n} like to ${o.style==='speed'?'shoot fast':o.style==='strength'?'tie up and throw':o.style==='technique'?'wait and counter':'mix it up'}.</p>
    <div class="row" style="justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:12px">${cardsEquipped().map(e=>`<span class="pill r-${e.c.r}" style="border:1px solid var(--rc)">${e.c.i} ${esc(e.c.n)} Lv${e.l}</span>`).join('')||'<span class="small muted">No move cards equipped</span>'}</div>
    <button class="btn block" data-act="boutGo">🤝 Shake hands</button></div>`);
  await waitAct();
  SFX.whistle(); say('Wrestle!');
  if(!S.tut){
    S.tut = true; save();
    modal(`${howToPlay()}<button class="btn block" style="margin-top:12px" data-act="closeTut">Got it — let's wrestle</button>`);
    await new Promise(res=>{ ACTIONS.closeTut = ()=>{ closeModal(); res(); }; });
  }
  while(true){
    if(B.ex===3){ stage(`<div class="panel" style="text-align:center"><h2>Period 2</h2><p class="muted">Score: ${B.my} - ${B.op}. ${B.my<B.op?"You're behind — dig deep!":B.my>B.op?'Keep the pressure on!':"It's all square!"}</p></div>`); shout(); SFX.whistle(); await sleep(1500); }
    await exchange();
    B.ex++; pips();
    const diff = B.my-B.op;
    if(Math.abs(diff)>=10){ say('Technical superiority!', 2000); await sleep(900); return endBout(diff>0, 'Technical superiority'); }
    if(B.ex>=6){
      if(B.my!==B.op) return endBout(B.my>B.op, 'Decision');
      if(B.ex===6 && B.last){ say('Last point wins!', 1800); await sleep(900); return endBout(B.last==='me', 'Criteria: last point scored'); }
      if(B.sudden>=3){ const win = statOf('hrt') + rnd(0,6) >= o.stats.hrt + rnd(0,6); return endBout(win, 'Heart decides it'); }
      if(B.ex===6+B.sudden){ B.sudden++; pips(); }
    }
  }
}

  w = clamp(w, .06, .5);
  const tecR = clamp(statOf('tec')/Math.max(1,o.stats.tec), .5, 2.2);
  const pf = clamp(.26*Math.pow(tecR,.6) + (res==='attack'?cardPerf(type):0), .12, .6);
  const conR = clamp(statOf('con')/Math.max(1,o.stats.con), .6, 1.8);
  const fat = 1 + .07*Math.min(B.ex,7)*(c.perks.fatigue||1);
  const speed = (0.85 + .01*o.L) * fat / Math.pow(conR,.5);
  const q = await runMeter({w, pf, speed, label, comeback, time:4200});

  if(myP>0){ lunge('me'); hit('op'); B.my+=myP; B.last='me'; floatPts('me', '+'+myP, myP>=4?'#f5c542':'#39d17a'); (myP>=4?SFX.perfect:SFX.good)(); say(myP>=4?`${myP} points!`:myP===1?'One!':`${myP}!`); if(myP>=4) SFX.cheer(); }
  if(opP>0){ lunge('op'); hit('me'); B.op+=opP; B.last='op'; floatPts('op', '+'+opP, '#ff8a7a'); SFX.thud(); say(opP>=4?'Four!':opP===1?'One!':'Two!'); }

    <div class="verdict ${kind}" style="font-size:24px">${esc(text)}</div>${follow?`<div class="verdict good">${esc(follow)}</div>`:''}</div>`);
  await sleep(1500);
}

function runMeter(cfg){
  const {w, pf, speed, label, comeback, time} = cfg;
  const center = rnd(w/2+.04, 1-w/2-.04);
  const pw = w*pf;
  stage(`<div class="panel">
    <div class="row"><b class="grow" style="font-size:17px">${esc(label)}</b>${comeback?'<span class="pill" style="background:var(--red)">🔥 Comeback power</span>':''}</div>
    <div class="meter" id="meter"><div class="zone" style="left:${(center-w/2)*100}%;width:${w*100}%"></div><div class="perf" style="left:${(center-pw/2)*100}%;width:${pw*100}%"></div><div class="mk" id="mk"></div><div class="tm" id="tm"></div></div>
    <button class="btn block tapbtn" id="tapBtn">TAP!</button>
    <div class="hint" style="margin-top:6px">Green = score · Gold = perfect · Space bar works too</div></div>`);
  return new Promise(res=>{
    const mk=$id('mk'), tm=$id('tm'), btn=$id('tapBtn'), meter=$id('meter');
    const t0 = performance.now(); let done=false, pos=0;
    const phase = Math.random();
    function frame(t){
      if(done) return;
      const el = (t-t0)/1000;
      const x = (el*speed + phase) % 2; pos = x<1 ? x : 2-x;
      mk.style.left = (pos*100)+'%';
      tm.style.width = Math.max(0, 100 - (t-t0)/time*100)+'%';
      if(t-t0>time){ finish(true); return; }
      requestAnimationFrame(frame);
    }
    function finish(timeout){
      if(done) return; done=true; UI.tap=null;
      const dist = Math.abs(pos-center);
      const qq = timeout ? 'miss' : dist<=pw/2 ? 'perfect' : dist<=w/2 ? 'good' : 'miss';
      mk.style.background = qq==='perfect'?'#f5c542':qq==='good'?'#39d17a':'#e5483f';
      btn.textContent = timeout ? 'Too slow!' : qq==='perfect'?'PERFECT!':qq==='good'?'GOOD!':'MISS';
      setTimeout(()=>res(qq), 450);
    }
    UI.tap = ()=>finish(false);
    btn.addEventListener('pointerdown', e=>{ e.preventDefault(); finish(false); });
    meter.addEventListener('pointerdown', e=>{ e.preventDefault(); finish(false); });
    requestAnimationFrame(frame);
  });
}

function addXP(n){
  const ups = [];
  S.xp += n;
  while(S.lvl<MAX_LVL && S.xp>=xpNeed(S.lvl)){
    S.xp -= xpNeed(S.lvl); S.lvl++;
    STATS.forEach(s=>S.stats[s.k]+=1);
    const sig = me().sig; sig.forEach(k=>S.stats[k] += sig.length>1?1:2);
    S.pts += 3; ups.push(S.lvl);
    S.energy = Math.max(S.energy, maxEnergy()); S.energyAt = Date.now();
  }
  if(S.lvl>=MAX_LVL) S.xp = 0;
  return ups;
}

function rollRarity(champ){
  const r = Math.random();
  if(champ){ return r<.06?'legendary':r<.26?'epic':r<.72?'rare':'common'; }
  return r<.02?'legendary':r<.10?'epic':r<.36?'rare':'common';
}
function makeLoot(rar){
  if(rar==='common' && Math.random()<.45) return Math.random()<.6 ? {type:'coins', n:20+S.lvl*8+ri(0,20), r:'common'} : {type:'energy', n:6, r:'common'};
  const pool = [...Object.keys(CARDS).filter(k=>CARDS[k].r===rar).map(k=>({type:'card',k,r:rar})), ...Object.keys(KIT).filter(k=>KIT[k].r===rar && k!=='phoenixSinglet').map(k=>({type:'kit',k,r:rar}))];
  const fresh = pool.filter(p=>p.type==='card' ? (S.cards[p.k]||0)<3 : !S.kit.owned[p.k]);
  return pick(fresh.length && Math.random()<.8 ? fresh : pool);
}
function lootView(l){
  if(l.type==='coins') return {i:'💰', n:`${l.n} coins`, d:'Spend them in the club shop'};
  if(l.type==='energy') return {i:'🥤', n:'Sports drink', d:`+${l.n} energy`};
  if(l.type==='card'){ const c=CARDS[l.k], cur=S.cards[l.k]||0; return {i:c.i, n:c.n, d: cur>=3 ? 'Already max level' : cur ? `Upgrade to Lv${cur+1}: ${c.d(cur+1)}` : `New move card! ${c.d(1)}`}; }
  const k=KIT[l.k]; return {i:SLOT_ICON[k.slot], n:k.n, d: S.kit.owned[l.k] ? 'Already owned' : kitDesc(k)};
}
function applyLoot(l){
  const rv = RARITY_ORDER.indexOf(l.r)+1;
  if(l.type==='coins'){ S.coins+=l.n; return `+${l.n} coins`; }
  if(l.type==='energy'){ S.energy=Math.min(maxEnergy()+10, S.energy+l.n); return `+${l.n} energy`; }
  if(l.type==='card'){ const cur=S.cards[l.k]||0; if(cur>=3){ const c=40*rv*rv; S.coins+=c; return `Max level already — swapped for ${c} coins`; } S.cards[l.k]=cur+1;
    if(!cur && S.equip.length<slotsFor(S.lvl)) S.equip.push(l.k);
    return cur ? `${CARDS[l.k].n} is now Lv${cur+1}!` : `${CARDS[l.k].n} added${S.equip.includes(l.k)?' and equipped':''}!`; }
  if(S.kit.owned[l.k]){ const c=35*rv*rv; S.coins+=c; return `Already owned — swapped for ${c} coins`; }
  S.kit.owned[l.k]=1; const it=KIT[l.k]; if(!S.kit.eq[it.slot] || RARITY_ORDER.indexOf(KIT[S.kit.eq[it.slot]]?.r)<RARITY_ORDER.indexOf(it.r)) S.kit.eq[it.slot]=l.k;
  return `${it.n} added to your kit!`;
}

    if(Math.random()<.3) shout();
    await sleep(500);
  }
  gain = Math.min(gain, 1-(S.trained[k]||0));
  S.trained[k] = (S.trained[k]||0)+gain; S.stats[k] += gain;
  const ups = addXP(xp); save();
  modal(`<div style="text-align:center"><div style="font-size:50px">${s.i}</div><h2>Session done!</h2><p><b>+${gain} ${s.n}</b> · ✨ +${xp} XP</p><button class="btn block" data-act="drillDone">Back to the gym</button></div>`);
  await new Promise(res=>{ ACTIONS.drillDone = ()=>{ closeModal(); res(); }; });
  for(const L of ups) await levelUpModal(L);
  go('gym', {gym:g.id});
};

// ---------- boot ----------
render();

</script>
</body></html>
